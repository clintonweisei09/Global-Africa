<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0F766E" />

    <!-- Primary Meta Tags -->
    <title>GlobalHire Africa — Your Gateway to International Careers</title>
    <meta name="title" content="GlobalHire Africa — Your Gateway to International Careers" />
    <meta name="description" content="Discover verified overseas job opportunities from trusted employers across 24 countries. Visa sponsorship, accommodation, and contract security for African talent. Apply for jobs in Canada, UAE, South Korea, Japan, UK, Germany and more." />
    <meta name="keywords" content="overseas jobs, international jobs, visa sponsorship, Africa jobs abroad, caregiver jobs Canada, housekeeper jobs UAE, factory worker Korea, recruitment Africa, GlobalHire" />
    <meta name="author" content="GlobalHire Africa" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://globalhire.africa/" />
    <meta property="og:title" content="GlobalHire Africa — Your Gateway to International Careers" />
    <meta property="og:description" content="Discover verified overseas job opportunities from trusted employers across 24 countries. Visa sponsorship, accommodation, and contract security for African talent." />
    <meta property="og:image" content="https://bolt.new/static/og_default.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://globalhire.africa/" />
    <meta name="twitter:title" content="GlobalHire Africa — Your Gateway to International Careers" />
    <meta name="twitter:description" content="Discover verified overseas job opportunities from trusted employers across 24 countries. Visa sponsorship, accommodation, and contract security for African talent." />
    <meta name="twitter:image" content="https://bolt.new/static/og_default.png" />

    <!-- Structured Data: Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "GlobalHire Africa",
      "description": "International recruitment platform connecting African talent with verified overseas employers.",
      "url": "https://globalhire.africa",
      "logo": "https://bolt.new/static/og_default.png",
      "sameAs": [
        "https://twitter.com/globalhire",
        "https://linkedin.com/company/globalhire"
      ]
    }
    </script>

    <!-- Structured Data: JobPosting -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "GlobalHire Africa",
      "url": "https://globalhire.africa",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://globalhire.africa/jobs?q={query}",
        "query-input": "required name=query"
      }
    }
    </script>

    <!-- Preconnect for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
